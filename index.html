<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلب اجازة - قسم الــ Back Office</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--tx:#222;--mu:#6d6d6d;--ac:#f26a0b;--ac2:#ff5a00;--bd:#e0e0e0;--hdr:#fff;--hdrtx:#222}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1d;--tx:#eee;--mu:#a0a0a0;--bd:#333;--hdr:#000;--hdrtx:#fff}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.6}
header{background:var(--hdr);padding:14px 16px 12px;text-align:center;border-bottom:4px solid var(--ac)}
header img{width:min(300px,72%);height:auto;display:block;margin:0 auto}
header h1{margin:10px 0 0;font-size:18px;color:var(--hdrtx);font-weight:bold}
.logo-d{display:none}
@media (prefers-color-scheme:dark){.logo-l{display:none}.logo-d{display:block}}
main{max-width:600px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.row{display:flex;gap:8px}.row>div{flex:1}
.btn{padding:12px 16px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:bold;margin-top:14px;width:100%;cursor:pointer}
.btn:disabled{opacity:.6}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;color:#fff}
.p{background:#c48a1a}.a{background:#1f7a5a}.r{background:#b23b3b}.mu{color:var(--mu);font-size:13px}.hd{display:flex;justify-content:space-between}
.hid{display:none}
</style>
</head>

function form(msg){
  var t=new Date().toISOString().slice(0,10);
  $("v").innerHTML=(msg?'<div class="card">'+msg+'</div>':'')+'<div class="card"><label>الاسم</label><input id="n" value="'+esc(ls("nm"))+'"><label>رقم الهاتف</label><input id="p" inputmode="tel" placeholder="07XXXXXXXXX" value="'+esc(ls("ph"))+'"><label>نوع الإجازة</label><select id="ty" onchange="tch()">'+TYPES.map(function(x){return "<option>"+x+"</option>"}).join("")+'</select><div class="row"><div><label id="lf">من</label><input type="date" id="f" value="'+t+'"></div><div id="ew"><label>إلى</label><input type="date" id="e" value="'+t+'"></div></div><div class="row hid" id="tw"><div><label>من الساعة</label><input type="time" id="ft" value="09:00"></div><div><label>إلى الساعة</label><input type="time" id="tt" value="11:00"></div></div><label>السبب</label><textarea id="r" rows="3"></textarea><button class="btn" id="sb" onclick="send()">إرسال الطلب إلى المدير</button></div>';
}
function tch(){
  var z=$("ty").value=="زمنية";
  $("tw").className="row"+(z?"":" hid");$("ew").className=z?"hid":"";$("lf").textContent=z?"التاريخ":"من";
}
function why(x){var m=String(x&&x.message||x);
  if(m=="HTML")return "الرابط يرجع صفحة بدل البيانات: تأكد أن النشر (تطبيق ويب) والوصول = أي شخص، وأن الإصدار المنشور فيه الكود.";
  return "تعذر الاتصال بالرابط ("+m+"): تأكد أن الوصول = أي شخص.";}
async function getRows(code){
  var t=await (await fetch(SCRIPT_URL+"?code="+encodeURIComponent(code!==undefined?code:myCode()))).text(),j;
  try{j=JSON.parse(t)}catch(e){throw new Error("HTML")}
  if(!j.ok)throw new Error("HTML");if(j.quota!=null&&!isNaN(Number(j.quota)))Q=Number(j.quota);return j.rows||[];
}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function send(){
  var n=$("n").value.trim(),p=$("p").value.trim(),f=$("f").value,e=$("e").value,ty=$("ty").value,z=ty=="زمنية",ft="",tt="";
  if(z){e=f;ft=$("ft").value;tt=$("tt").value;if(!ft||!tt)return alert("حدد الوقت من الساعة إلى الساعة");if(hrs(ft,tt)<=0)return alert("وقت النهاية يجب أن يكون بعد وقت البداية")}
  if(!n||p.replace(/\D/g,"").length<6||!f||!e)return alert("يرجى ملء الاسم والهاتف والتواريخ");
  if(e<f)return alert("تاريخ النهاية قبل البداية");
  if(SCRIPT_URL.indexOf("http")!=0)return alert("لم يتم ربط الشيت بعد.");
  ls("nm",n);ls("ph",p);$("sb").disabled=true;$("sb").textContent="جاري الإرسال...";
  var before=null;try{before=(await getRows()).length}catch(x){}
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({name:n,phone:p,type:ty,from:f,to:e,fromTime:ft,toTime:tt,reason:$("r").value.trim(),code:myCode()})});
  }catch(x){alert("تعذر الإرسال، تأكد من الاتصال بالإنترنت");$("sb").disabled=false;$("sb").textContent="إرسال الطلب إلى المدير";return}
  var ok=false,err=null;
  for(var i=0;i<3&&!ok;i++){
    await wait(i?2500:1500);
    try{var rows=await getRows();ok=before===null?rows.length>0:rows.length>before}catch(x){err=x;break}
  }
  form(ok?'✅ تم رفع طلبك.<br>رمزك الخاص: <b style="font-size:18px;letter-spacing:2px">'+myCode()+'</b><br><span class="mu">احتفظ به لمتابعة طلباتك من تبويب «طلباتي»، حتى من جهاز آخر.</span>':"⚠️ لم نتمكن من تأكيد وصول الطلب. "+esc(err?why(err):"لم يظهر في الشيت بعد، افحص تبويب «طلباتي» بعد قليل قبل إعادة الإرسال."));
}
function dur(l){
  if(l.type=="زمنية"&&l.fromTime&&l.toTime){var h=Math.round(hrs(l.fromTime,l.toTime)*100)/100;return l.from+" من الساعة "+l.fromTime+" إلى "+l.toTime+" ("+h+" ساعة)"}
  return "من "+l.from+" إلى "+l.to+" ("+l.days+" يوم)";
}
function codeForm(msg){
  $("v").innerHTML=(msg?'<div class="card mu">'+esc(msg)+'</div>':'')+'<div class="card"><label>أدخل رمزك الخاص (6 رموز، تسلّمته عند إرسال الطلب)</label><input id="cc" style="text-align:center;letter-spacing:3px;font-size:18px" maxlength="6" value="'+esc(ls("code"))+'"><button class="btn" onclick="useCode()">عرض طلباتي</button></div>';
}
function useCode(){var c=$("cc").value.trim().toUpperCase();if(c.length!=6)return alert("الرمز مكوّن من 6 رموز");ls("code",c);mine()}
function codeBar(){return '<div class="card mu" style="display:flex;justify-content:space-between;align-items:center">رمزك: <b style="letter-spacing:2px">'+esc(ls("code"))+'</b><a href="#" onclick="codeForm();return false" style="color:var(--ac)">استخدام رمز آخر</a></div>'}
async function mine(){
  if(!ls("code")){codeForm();return}
  $("v").innerHTML='<div class="card mu">جاري التحميل...</div>';
  try{
    var rows=await getRows();
    var y=String(new Date().getFullYear()),used=0;
    rows.forEach(function(l){if(l.status=="موافق"&&l.type!="بدون راتب"&&String(l.from).slice(0,4)==y)used+=Number(l.days)});
    used=Math.round(used*100)/100;
    var m={"موافق":"a","مرفوض":"r"};
    if(!rows.length){codeForm("لا توجد طلبات بهذا الرمز. تأكد من الرمز أو قدّم طلباً جديداً.");return}
    $("v").innerHTML=codeBar()+'<div class="card"><b>رصيدك لسنة '+y+'</b><div class="mu">المستخدم: '+used+' • المتبقي: '+(Math.round((Q-used)*100)/100)+' من '+Q+' يوم</div></div>'+
    rows.map(function(l){return '<div class="card"><div class="hd"><b>'+esc(l.type)+'</b><span class="tag '+(m[l.status]||"p")+'">'+esc(l.status)+'</span></div><div class="mu">'+esc(dur(l))+'</div>'+(l.reason?'<div>'+esc(l.reason)+'</div>':'')+(l.note?'<div class="mu">ملاحظة المدير: '+esc(l.note)+'</div>':'')+'</div>'}).join("");
  }catch(x){$("v").innerHTML=codeBar()+'<div class="card mu">تعذر تحميل الطلبات. '+esc(why(x))+'</div>'}
}
form();
</script>
</body>
</html>
